# ============================================================================
#  SocraMetry — CI（型チェック / lint / テスト / ZIP ビルド検証）
#
#  仕様: docs/deployment.md
# ============================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # packages/core の純関数テスト。LeakGuard の回帰テスト 50 ケースを含む（NFR-Q1）
      - name: Test
        run: pnpm test

      # デプロイ前に壊れていないか、ビルドだけ通しておく
      # build.mjs 自身が ZIP の要件（CommonJS / handler の公開 / 250MB 以下）を検証する
      - name: Build ZIP (dry run)
        run: pnpm --filter @socrametry/function build:zip
